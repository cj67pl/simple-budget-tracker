<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Budget Tracker</h1>
    </header>

    <main class="app-container">

        
        <section class="panel panel-left">

           
            <section class="transaction-form">
                <h2>Add Transaction</h2>

                <form id="transactionForm">

                    <div class="form-group">
                        <label for="transactionType">Type:</label>
                        <select id="transactionType" required>
                            <option value="" disabled selected hidden>Select</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="transactionAmount">Amount:</label>
                        <input type="number" id="transactionAmount" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="transactionCategory">Category:</label>
                        <select id="transactionCategory" disabled>
                            <option value="">Select category</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="transactionDescription">Description:</label>
                        <textarea id="transactionDescription" placeholder="Optional"></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Add</button>

                </form>
            </section>

            
            <section class="summary">
                <h2>Summary</h2>

                <div class="summary-item">
                    <span class="identifier">Total Income:</span>
                    <span class="content" id="totalIncome">₱0</span>
                </div>

                <div class="summary-item">
                    <span class="identifier">Total Expenses:</span>
                    <span class="content" id="totalExpenses">₱0</span>
                </div>

                <div class="summary-item balance">
                    <span class="identifier">Balance:</span>
                    <span class="content" id="balance">₱0</span>
                </div>
            </section>

        </section>

        
        <section class="panel panel-right">

            
            <section class="filters">
                
                <select id="filterMonth">
                    <option value="all">All Months</option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                </select>
            </section>

            
            <section class="transactions-container">

                
                <section class="transaction-column expense-column">
                    <h2 class="column-title">Expenses</h2>

                    <!-- <div class="transaction-list" id="expenseList">

                        
                        <div class="transaction-card expense-card">

                            <p class="transaction-row">
                                <span class="item-label">Category:</span>
                                <span class="item-value transaction-category">Utilities</span>
                            </p>

                            <p class="transaction-row">
                                <span class="item-label">Amount:</span>
                                <span class="item-value transaction-amount">20000</span>
                            </p>

                            <p class="transaction-row">
                                <span class="item-label">Description:</span>
                                <span class="item-value transaction-description">Used in repairs</span>
                            </p>
                            <div class="delete-container">
                                <button id="delete">Delete</button>
                            </div>
                        </div>
                    </div>
                         -->
                
                
                    <div class="transaction-list" id="expenseList"></div>
                </section>

                
                <section class="transaction-column income-column">
                    <h2 class="column-title">Income</h2>

                    <div class="transaction-list" id="incomeList">

                        <!-- <div class="transaction-card income-card">

                            <p class="transaction-row">
                                <span class="item-label">Category:</span>
                                <span class="item-value transaction-category">Salary</span>
                            </p>

                            <p class="transaction-row">
                                <span class="item-label">Amount:</span>
                                <span class="item-value transaction-amount">20000</span>
                            </p>

                            <p class="transaction-row">
                                <span class="item-label">Description:</span>
                                <span class="item-value transaction-description">Salary from main job</span>
                            </p>

                        </div> -->

                    </div>
                </section>

            </section>

        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
